name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt apksigner d8 zip

      - name: Run setup script
        run: bash setup.sh

      - name: Build APK
        run: bash build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrickKiln-APK
          path: |
            **/*.apk
